name: Phase 0A Integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-baseline-and-current:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with frozen baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected current files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f netlify.toml
          test -f README.txt

      - name: Verify frozen Phase 0A index checksum
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e c578b4240a2bd9899db602fa818bda99bd6ff3cd^{commit}
          git show c578b4240a2bd9899db602fa818bda99bd6ff3cd:index.html > /tmp/attendance-v1-frozen.html
          echo "199d93f81c1cdb1742544f0dbde3f9da2e264b9d2dc16e4ce93cd53140387086  /tmp/attendance-v1-frozen.html" | sha256sum --check --strict

      - name: Extract current inline ES module
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          matches = re.findall(r'<script\s+type="module"[^>]*>(.*?)</script>', html, flags=re.S | re.I)
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one inline ES module, found {len(matches)}")
          Path("/tmp/attendance-current-module.mjs").write_text(matches[0], encoding="utf-8")

      - name: Check current JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/attendance-current-module.mjs
