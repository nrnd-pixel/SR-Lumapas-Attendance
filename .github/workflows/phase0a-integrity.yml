name: Phase 0A Integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-baseline-and-current:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with frozen baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected current files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/js/main.js
          test -f assets/js/supabase-client.js
          test -f assets/js/app-state.js
          test -f assets/js/date-helpers.js
          test -f assets/js/ui-helpers.js
          test -f assets/js/auth-session.js
          test -f assets/js/attendance-register.js
          test -f netlify.toml
          test -f README.txt

      - name: Verify frozen Phase 0A index checksum
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e c578b4240a2bd9899db602fa818bda99bd6ff3cd^{commit}
          git show c578b4240a2bd9899db602fa818bda99bd6ff3cd:index.html > /tmp/attendance-v1-frozen.html
          echo "199d93f81c1cdb1742544f0dbde3f9da2e264b9d2dc16e4ce93cd53140387086  /tmp/attendance-v1-frozen.html" | sha256sum --check --strict

      - name: Verify historical Phase 3A external-module extraction
        shell: python
        run: |
          import re
          import subprocess

          pre3_sha = "88fffe819a4b287bd05c48c0933ebf14c7d913d2"
          phase3a_sha = "0526944153c4176d47ea1a2b0891e3ed56fe479c"
          for sha in (pre3_sha, phase3a_sha):
              subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], check=True)

          before = subprocess.check_output(["git", "show", f"{pre3_sha}:index.html"], text=True)
          matches = list(re.finditer(r'<script\s+type="module"[^>]*>\n(.*?)</script>', before, flags=re.S | re.I))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one pre-Phase-3 inline ES module, found {len(matches)}")

          match = matches[0]
          expected_module = match.group(1)
          phase3a_module = subprocess.check_output(["git", "show", f"{phase3a_sha}:assets/js/main.js"], text=True)
          if phase3a_module != expected_module:
              raise SystemExit("Historical Phase 3A main.js is not byte-for-byte equivalent to the pre-Phase-3 inline module")

          loader = '<script type="module" src="./assets/js/main.js"></script>'
          expected_html = before[:match.start()] + loader + before[match.end():]
          phase3a_html = subprocess.check_output(["git", "show", f"{phase3a_sha}:index.html"], text=True)
          if phase3a_html != expected_html:
              raise SystemExit("Historical Phase 3A index.html contains changes beyond the exact external-module extraction")

      - name: Verify historical Phase 3B1 Supabase client split
        shell: python
        run: |
          import subprocess

          phase3a_sha = "0526944153c4176d47ea1a2b0891e3ed56fe479c"
          phase3b1_sha = "ad2026b1056e311e41b50746601398938b73e16a"
          for sha in (phase3a_sha, phase3b1_sha):
              subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], check=True)

          before_main = subprocess.check_output(["git", "show", f"{phase3a_sha}:assets/js/main.js"], text=True)
          old_import = "import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/+esm';\n"
          new_import = "import { createAttendanceClient } from './supabase-client.js';\n"
          old_client = "const sb=createClient(\n  'https://rojetehazryfpcxlwtbi.supabase.co',\n  'sb_publishable_gc1-vVGBZOSgw32SCJumyw__vm0e3Jd',\n  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}\n);\n"
          new_client = "const sb=createAttendanceClient();\n"
          if before_main.count(old_import) != 1 or before_main.count(old_client) != 1:
              raise SystemExit("Historical Phase 3A source does not contain the expected unique Supabase client blocks")

          expected_main = before_main.replace(old_import, new_import, 1).replace(old_client, new_client, 1)
          phase3b1_main = subprocess.check_output(["git", "show", f"{phase3b1_sha}:assets/js/main.js"], text=True)
          if phase3b1_main != expected_main:
              raise SystemExit("Historical Phase 3B1 main.js is not the exact approved client extraction")

          expected_client = "\n".join([
              "import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/+esm';",
              "",
              "export function createAttendanceClient(){",
              "  return createClient(",
              "    'https://rojetehazryfpcxlwtbi.supabase.co',",
              "    'sb_publishable_gc1-vVGBZOSgw32SCJumyw__vm0e3Jd',",
              "    {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}",
              "  );",
              "}",
              ""
          ])
          phase3b1_client = subprocess.check_output(["git", "show", f"{phase3b1_sha}:assets/js/supabase-client.js"], text=True)
          if phase3b1_client != expected_client:
              raise SystemExit("Historical Phase 3B1 supabase-client.js is not the exact approved client factory")

          phase3a_html = subprocess.check_output(["git", "show", f"{phase3a_sha}:index.html"], text=True)
          phase3b1_html = subprocess.check_output(["git", "show", f"{phase3b1_sha}:index.html"], text=True)
          if phase3b1_html != phase3a_html:
              raise SystemExit("Historical Phase 3B1 changed index.html")

      - name: Verify historical Phase 3B2 shared-state split
        shell: python
        run: |
          import subprocess

          phase3b1_sha = "ad2026b1056e311e41b50746601398938b73e16a"
          phase3b2_sha = "ece37a0cfeaf996a20c10a3f0cc638d35cea3c56"
          for sha in (phase3b1_sha, phase3b2_sha):
              subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], check=True)
          before_main = subprocess.check_output(["git", "show", f"{phase3b1_sha}:assets/js/main.js"], text=True)

          client_import = "import { createAttendanceClient } from './supabase-client.js';\n"
          state_import = "import { state, requestSerial, beginRequest, isLatestRequest } from './app-state.js';\n"
          state_decl = "const state={bootstrap:null,teacherStatus:null,register:null,rows:[],loading:false,saving:false,currentClassId:null,currentDate:null,adminRoster:null,selectedAdminStudent:null,teacherRequests:[],teachers:[],monthlyStats:null,adminDashboard:null,reportOptions:null,periodReport:null};\n"
          serial_decl = "const requestSerial={register:0,monthlyStats:0,adminDashboard:0,reportOptions:0,periodReport:0};\n"
          helper_block = "function beginRequest(kind){requestSerial[kind]+=1;return requestSerial[kind];}\nfunction isLatestRequest(kind,serial){return requestSerial[kind]===serial;}\n"

          for label, text in [('client import', client_import), ('state declaration', state_decl), ('request serial declaration', serial_decl), ('request helper block', helper_block)]:
              if before_main.count(text) != 1:
                  raise SystemExit(f"Historical Phase 3B1 source does not contain exactly one {label}")

          expected_main = before_main.replace(client_import, client_import + state_import, 1)
          expected_main = expected_main.replace(state_decl, '', 1).replace(serial_decl, '', 1).replace(helper_block, '', 1)
          phase3b2_main = subprocess.check_output(["git", "show", f"{phase3b2_sha}:assets/js/main.js"], text=True)
          if phase3b2_main != expected_main:
              raise SystemExit("Historical Phase 3B2 main.js is not the exact approved state/request-serial extraction")

          expected_state = "\n".join([
              "export const state={bootstrap:null,teacherStatus:null,register:null,rows:[],loading:false,saving:false,currentClassId:null,currentDate:null,adminRoster:null,selectedAdminStudent:null,teacherRequests:[],teachers:[],monthlyStats:null,adminDashboard:null,reportOptions:null,periodReport:null};",
              "export const requestSerial={register:0,monthlyStats:0,adminDashboard:0,reportOptions:0,periodReport:0};",
              "",
              "export function beginRequest(kind){requestSerial[kind]+=1;return requestSerial[kind];}",
              "export function isLatestRequest(kind,serial){return requestSerial[kind]===serial;}",
              ""
          ])
          phase3b2_state = subprocess.check_output(["git", "show", f"{phase3b2_sha}:assets/js/app-state.js"], text=True)
          if phase3b2_state != expected_state:
              raise SystemExit("Historical Phase 3B2 app-state.js is not the exact approved shared-state module")

          phase3b1_client = subprocess.check_output(["git", "show", f"{phase3b1_sha}:assets/js/supabase-client.js"], text=True)
          phase3b2_client = subprocess.check_output(["git", "show", f"{phase3b2_sha}:assets/js/supabase-client.js"], text=True)
          if phase3b2_client != phase3b1_client:
              raise SystemExit("Historical Phase 3B2 changed supabase-client.js")

          phase3b1_html = subprocess.check_output(["git", "show", f"{phase3b1_sha}:index.html"], text=True)
          phase3b2_html = subprocess.check_output(["git", "show", f"{phase3b2_sha}:index.html"], text=True)
          if phase3b2_html != phase3b1_html:
              raise SystemExit("Historical Phase 3B2 changed index.html")

      - name: Verify historical Phase 3B3A date-helper split
        shell: python
        run: |
          import subprocess

          phase3b2_sha = "ece37a0cfeaf996a20c10a3f0cc638d35cea3c56"
          phase3b3a_sha = "8427442405d6d5a20debe430163b21c243f167ae"
          for sha in (phase3b2_sha, phase3b3a_sha):
              subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], check=True)
          before_main = subprocess.check_output(["git", "show", f"{phase3b2_sha}:assets/js/main.js"], text=True)

          state_import = "import { state, requestSerial, beginRequest, isLatestRequest } from './app-state.js';\n"
          date_import = "import { bruneiToday, displayDate, formatMonthLabel, shortDay } from './date-helpers.js';\n"
          brunei_block = "function bruneiToday(){\n  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Brunei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());\n  const o={}; parts.forEach(p=>o[p.type]=p.value); return o.year+'-'+o.month+'-'+o.day;\n}\n"
          display_block = "function displayDate(s){\n  if(!s)return'';\n  const [y,m,d]=s.split('-').map(Number);\n  return new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})\n    .format(new Date(Date.UTC(y,m-1,d)));\n}\n"
          month_block = "function formatMonthLabel(v){if(!v)return'';const [y,m]=v.split('-').map(Number);return new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,1)));}\n"
          short_block = "function shortDay(v){if(!v)return'';const [y,m,d]=v.split('-').map(Number);return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d)));}\n"

          for label, text in [('state import', state_import), ('bruneiToday', brunei_block), ('displayDate', display_block), ('formatMonthLabel', month_block), ('shortDay', short_block)]:
              if before_main.count(text) != 1:
                  raise SystemExit(f"Historical Phase 3B2 source does not contain exactly one {label}")

          expected_main = before_main.replace(state_import, state_import + date_import, 1)
          for block in (brunei_block, display_block, month_block, short_block):
              expected_main = expected_main.replace(block, '', 1)
          phase3b3a_main = subprocess.check_output(["git", "show", f"{phase3b3a_sha}:assets/js/main.js"], text=True)
          if phase3b3a_main != expected_main:
              raise SystemExit("Historical Phase 3B3A main.js is not the exact approved date-helper extraction")

          expected_date = (
              brunei_block.replace("function bruneiToday", "export function bruneiToday", 1)
              + display_block.replace("function displayDate", "export function displayDate", 1)
              + month_block.replace("function formatMonthLabel", "export function formatMonthLabel", 1)
              + short_block.replace("function shortDay", "export function shortDay", 1)
          )
          phase3b3a_date = subprocess.check_output(["git", "show", f"{phase3b3a_sha}:assets/js/date-helpers.js"], text=True)
          if phase3b3a_date != expected_date:
              raise SystemExit("Historical Phase 3B3A date-helpers.js is not the exact approved date-helper module")

          for path in ("assets/js/app-state.js", "assets/js/supabase-client.js", "index.html"):
              before = subprocess.check_output(["git", "show", f"{phase3b2_sha}:{path}"], text=True)
              after = subprocess.check_output(["git", "show", f"{phase3b3a_sha}:{path}"], text=True)
              if after != before:
                  raise SystemExit(f"Historical Phase 3B3A changed {path}")

      - name: Verify historical Phase 3B3B UI-helper split
        shell: python
        run: |
          import subprocess

          phase3b3a_sha = "8427442405d6d5a20debe430163b21c243f167ae"
          phase3b3b_sha = "53ed00e309f221a0f19e2ec446a41e01144177b0"
          for sha in (phase3b3a_sha, phase3b3b_sha):
              subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], check=True)
          before_main = subprocess.check_output(["git", "show", f"{phase3b3a_sha}:assets/js/main.js"], text=True)

          date_import = "import { bruneiToday, displayDate, formatMonthLabel, shortDay } from './date-helpers.js';\n"
          ui_import = "import { $, esc, fillGroupedClasses } from './ui-helpers.js';\n"
          dollar_decl = "const $=id=>document.getElementById(id);\n"
          esc_decl = "function esc(v=''){return String(v).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',\"'\":'&#39;','\"':'&quot;'}[c]));}\n"
          fill_block = "function fillGroupedClasses(select,classes,{blankLabel=null,excludeId=null,compact=false}={}){\n  select.innerHTML='';\n  if(blankLabel!==null){const o=document.createElement('option');o.value='';o.textContent=blankLabel;select.appendChild(o);}\n  const groups=new Map();\n  (classes||[]).filter(c=>c.id!==excludeId).forEach(c=>{const y=c.year_level||0;if(!groups.has(y))groups.set(y,[]);groups.get(y).push(c);});\n  [...groups.keys()].sort((a,b)=>a-b).forEach(y=>{\n    const g=document.createElement('optgroup');g.label=y===0?'Prasekolah':'Year '+y;\n    groups.get(y).sort((a,b)=>a.class_code.localeCompare(b.class_code)).forEach(c=>{\n      const o=document.createElement('option');o.value=c.id;\n      o.textContent=compact?(y===0?c.class_code.replace('PRA ','Pra '):c.class_code):(c.class_code+' — '+c.class_name);\n      g.appendChild(o);\n    });select.appendChild(g);\n  });\n}\n"

          for label, text in [('date import', date_import), ('dollar helper', dollar_decl), ('escape helper', esc_decl), ('class grouping helper', fill_block)]:
              if before_main.count(text) != 1:
                  raise SystemExit(f"Historical Phase 3B3A source does not contain exactly one {label}")

          expected_main = before_main.replace(date_import, date_import + ui_import, 1)
          expected_main = expected_main.replace(dollar_decl, '', 1).replace(esc_decl, '', 1).replace(fill_block, '', 1)
          phase3b3b_main = subprocess.check_output(["git", "show", f"{phase3b3b_sha}:assets/js/main.js"], text=True)
          if phase3b3b_main != expected_main:
              raise SystemExit("Historical Phase 3B3B main.js is not the exact approved UI-helper extraction")

          expected_ui = (
              dollar_decl.replace("const $", "export const $", 1)
              + "\n"
              + esc_decl.replace("function esc", "export function esc", 1)
              + "\n"
              + fill_block.replace("function fillGroupedClasses", "export function fillGroupedClasses", 1)
          )
          phase3b3b_ui = subprocess.check_output(["git", "show", f"{phase3b3b_sha}:assets/js/ui-helpers.js"], text=True)
          if phase3b3b_ui != expected_ui:
              raise SystemExit("Historical Phase 3B3B ui-helpers.js is not the exact approved helper module")

          for path in ("assets/js/date-helpers.js", "assets/js/app-state.js", "assets/js/supabase-client.js", "index.html"):
              before = subprocess.check_output(["git", "show", f"{phase3b3a_sha}:{path}"], text=True)
              after = subprocess.check_output(["git", "show", f"{phase3b3b_sha}:{path}"], text=True)
              if after != before:
                  raise SystemExit(f"Historical Phase 3B3B changed {path}")

      - name: Verify historical Phase 3B4 auth-session split
        shell: python
        run: |
          import hashlib
          import subprocess

          phase3b4_base = "cf753418b51e92ff91b223d448bbee2a783d3736"
          phase3b4_sha = "4cce7446a51671e35443247a755672d1f422d6c0"
          for sha in (phase3b4_base, phase3b4_sha):
              subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], check=True)
          before_main = subprocess.check_output(["git", "show", f"{phase3b4_base}:assets/js/main.js"], text=True)

          ui_import = "import { $, esc, fillGroupedClasses } from './ui-helpers.js';\n"
          auth_import = "import { initAuthSession, hideEntryViews, showLogin } from './auth-session.js';\n"
          recovery_state = "const initialRecoveryLink=\n  new URLSearchParams(window.location.hash.slice(1)).get('type')==='recovery'\n  || new URLSearchParams(window.location.search.slice(1)).get('type')==='recovery';\nconst sb=createAttendanceClient();\nlet passwordRecoveryActive=initialRecoveryLink;\n"
          client_only = "const sb=createAttendanceClient();\n"
          entry_block = "async function init(){\n  $('dateInput').value=bruneiToday();\n  sb.auth.onAuthStateChange((event,session)=>{\n    if(event==='PASSWORD_RECOVERY'){passwordRecoveryActive=true;showRecovery();return;}\n    if(event==='SIGNED_OUT'){passwordRecoveryActive=false;showLogin();return;}\n  });\n  const {data:{session}}=await sb.auth.getSession();\n  if(passwordRecoveryActive){showRecovery();return;}\n  if(session)await enterApp(); else showLogin();\n}\nfunction hideEntryViews(){\n  ['loginView','signupView','teacherGateView','recoveryView','appView'].forEach(id=>$(id).classList.add('hidden'));\n}\nfunction showLogin(){hideEntryViews();$('loginView').classList.remove('hidden');}\n"
          entry_replacement = "async function init(){\n  $('dateInput').value=bruneiToday();\n  await initAuthSession(sb,enterApp);\n}\n"
          show_recovery = "function showRecovery(){hideEntryViews();$('recoveryView').classList.remove('hidden');}\n"
          login_listener = "$('loginForm').addEventListener('submit',async e=>{\n  e.preventDefault();$('loginMsg').textContent='';$('loginBtn').disabled=true;$('loginBtn').innerHTML='<span class=\"spinner\"></span> Signing in';\n  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});\n  $('loginBtn').disabled=false;$('loginBtn').textContent='Sign In';\n  if(error){$('loginMsg').textContent=error.message;return;}await enterApp();\n});\n\n"
          recovery_listeners = "$('forgotBtn').addEventListener('click',async()=>{\n  const email=$('email').value.trim();\n  if(!email){$('loginMsg').textContent='Enter your email address first.';return;}\n  $('forgotBtn').disabled=true;\n  $('loginMsg').textContent='Sending password reset email…';\n  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/'});\n  $('forgotBtn').disabled=false;\n  if(error){$('loginMsg').textContent=error.message;return;}\n  $('loginMsg').style.color='#147a4b';\n  $('loginMsg').textContent='Password reset email sent. Open the email on this phone and tap the recovery link.';\n});\n$('recoveryForm').addEventListener('submit',async e=>{\n  e.preventDefault();\n  $('recoveryMsg').textContent='';\n  if($('newPassword').value!==$('confirmPassword').value){\n    $('recoveryMsg').textContent='The two passwords do not match.';return;\n  }\n  $('recoveryBtn').disabled=true;\n  const {error}=await sb.auth.updateUser({password:$('newPassword').value});\n  if(error){$('recoveryBtn').disabled=false;$('recoveryMsg').textContent=error.message;return;}\n  const {error:signOutError}=await sb.auth.signOut();\n  $('recoveryBtn').disabled=false;\n  if(signOutError){\n    $('recoveryMsg').textContent='Password updated, but the recovery session could not be signed out. Please try again.';return;\n  }\n  passwordRecoveryActive=false;\n  $('recoveryForm').reset();\n  showLogin();\n  $('loginMsg').style.color='#147a4b';\n  $('loginMsg').textContent='Password updated successfully. Sign in with your new password.';\n});\n$('signOutBtn').addEventListener('click',async()=>{await sb.auth.signOut();showLogin();});\n"

          for label, text in [
              ('UI import', ui_import),
              ('recovery/client state', recovery_state),
              ('entry routing block', entry_block),
              ('recovery view helper', show_recovery),
              ('login listener', login_listener),
              ('recovery listeners', recovery_listeners),
          ]:
              if before_main.count(text) != 1:
                  raise SystemExit(f"Phase 3B4 base does not contain exactly one expected {label}")

          expected_main = before_main.replace(ui_import, ui_import + auth_import, 1)
          expected_main = expected_main.replace(recovery_state, client_only, 1)
          expected_main = expected_main.replace(entry_block, entry_replacement, 1)
          expected_main = expected_main.replace(show_recovery, '', 1)
          expected_main = expected_main.replace(login_listener, '', 1)
          expected_main = expected_main.replace(recovery_listeners, '', 1)

          phase3b4_main = subprocess.check_output(["git", "show", f"{phase3b4_sha}:assets/js/main.js"], text=True)
          if phase3b4_main != expected_main:
              raise SystemExit("Historical Phase 3B4 main.js is not the exact approved auth-session extraction")

          auth_bytes = subprocess.check_output(["git", "show", f"{phase3b4_sha}:assets/js/auth-session.js"])
          if hashlib.sha256(auth_bytes).hexdigest() != "c084de8ca11ba4959f67afc26bf1885b6c20c38688de46f197978fc5a5651b71":
              raise SystemExit("Historical Phase 3B4 auth-session.js does not match the approved module")

          for path in (
              "index.html",
              "assets/js/supabase-client.js",
              "assets/js/app-state.js",
              "assets/js/date-helpers.js",
              "assets/js/ui-helpers.js",
              "netlify.toml",
          ):
              before = subprocess.check_output(["git", "show", f"{phase3b4_base}:{path}"], text=True)
              after = subprocess.check_output(["git", "show", f"{phase3b4_sha}:{path}"], text=True)
              if after != before:
                  raise SystemExit(f"Historical Phase 3B4 changed {path}")

      - name: Verify exact Phase 3B5 attendance-register split
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          phase3b5_base = "dc274130989e32d354ff4f28d8cc3c302010b7e5"
          subprocess.run(["git", "cat-file", "-e", f"{phase3b5_base}^{{commit}}"], check=True)
          before_main = subprocess.check_output(["git", "show", f"{phase3b5_base}:assets/js/main.js"], text=True)

          auth_import = "import { initAuthSession, hideEntryViews, showLogin } from './auth-session.js';\n"
          attendance_import = "import { initAttendanceRegister, setBusy, setBanner, loadRegister, confirmDiscard, markAllPresent, clearAll, updateSummary, save, hasUnsavedChanges } from './attendance-register.js';\n"
          client_decl = "const sb=createAttendanceClient();\n"
          client_replacement = client_decl + "initAttendanceRegister(sb);\n"

          for label, text in [('auth import', auth_import), ('client declaration', client_decl)]:
              if before_main.count(text) != 1:
                  raise SystemExit(f"Phase 3B5 base does not contain exactly one expected {label}")

          def take_span(text, start_marker, end_marker):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[start:end]

          def remove_span(text, start_marker, end_marker, replacement=''):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          routine_block = take_span(before_main, "const routineOptions=[", "function periodReportSelectionKey(){").rstrip('\n')
          helper_block = take_span(before_main, "function groupFromCode(code){", "async function getSignupClasses(){").rstrip('\n')
          busy_block = take_span(before_main, "function setBusy(flag){", "async function init(){").rstrip('\n')
          attendance_block = take_span(before_main, "async function loadRegister(){", "function switchPanel(name){").rstrip('\n')

          expected_main = before_main.replace(auth_import, auth_import + attendance_import, 1)
          expected_main = expected_main.replace(client_decl, client_replacement, 1)
          expected_main = remove_span(expected_main, "const routineOptions=[", "function periodReportSelectionKey(){", "\n")
          expected_main = remove_span(expected_main, "function groupFromCode(code){", "async function getSignupClasses(){")
          expected_main = remove_span(expected_main, "function setBusy(flag){", "async function init(){")
          expected_main = remove_span(expected_main, "async function loadRegister(){", "function switchPanel(name){")

          current_main = Path("assets/js/main.js").read_text(encoding="utf-8")
          if current_main != expected_main:
              raise SystemExit("assets/js/main.js contains changes beyond the exact Phase 3B5 attendance-register extraction")

          helper_exports = helper_block
          helper_exports = helper_exports.replace("function hasUnsavedChanges", "export function hasUnsavedChanges", 1)
          helper_exports = helper_exports.replace("function confirmDiscard", "export function confirmDiscard", 1)
          busy_exports = busy_block
          busy_exports = busy_exports.replace("function setBusy", "export function setBusy", 1)
          busy_exports = busy_exports.replace("function setBanner", "export function setBanner", 1)
          attendance_exports = attendance_block
          for before, after in (
              ("async function loadRegister", "export async function loadRegister"),
              ("function markAllPresent", "export function markAllPresent"),
              ("function clearAll", "export function clearAll"),
              ("function updateSummary", "export function updateSummary"),
              ("async function save", "export async function save"),
          ):
              if attendance_exports.count(before) != 1:
                  raise SystemExit(f"Phase 3B5 attendance block does not contain exactly one {before}")
              attendance_exports = attendance_exports.replace(before, after, 1)

          expected_module = (
              "import { state, beginRequest, isLatestRequest } from './app-state.js';\n"
              "import { displayDate } from './date-helpers.js';\n"
              "import { $, esc } from './ui-helpers.js';\n\n"
              "let sb;\n\n"
              "export function initAttendanceRegister(client){sb=client;}\n\n"
              + routine_block + "\n\n"
              + helper_exports + "\n\n"
              + busy_exports + "\n\n"
              + attendance_exports + "\n"
          )
          current_module = Path("assets/js/attendance-register.js").read_text(encoding="utf-8")
          if current_module != expected_module:
              raise SystemExit("assets/js/attendance-register.js is not the exact approved Phase 3B5 extraction")

          for path in (
              "index.html",
              "assets/js/supabase-client.js",
              "assets/js/app-state.js",
              "assets/js/date-helpers.js",
              "assets/js/ui-helpers.js",
              "assets/js/auth-session.js",
              "netlify.toml",
          ):
              historical = subprocess.check_output(["git", "show", f"{phase3b5_base}:{path}"], text=True)
              current = Path(path).read_text(encoding="utf-8")
              if current != historical:
                  raise SystemExit(f"Phase 3B5 must not change {path}")

      - name: Check current JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/main.js
          node --check assets/js/supabase-client.js
          node --check assets/js/app-state.js
          node --check assets/js/date-helpers.js
          node --check assets/js/ui-helpers.js
          node --check assets/js/auth-session.js
          node --check assets/js/attendance-register.js
