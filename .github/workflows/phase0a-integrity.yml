name: Phase 0A Integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-baseline-and-current:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with frozen baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected current files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/js/main.js
          test -f assets/js/supabase-client.js
          test -f assets/js/app-state.js
          test -f netlify.toml
          test -f README.txt

      - name: Verify frozen Phase 0A index checksum
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e c578b4240a2bd9899db602fa818bda99bd6ff3cd^{commit}
          git show c578b4240a2bd9899db602fa818bda99bd6ff3cd:index.html > /tmp/attendance-v1-frozen.html
          echo "199d93f81c1cdb1742544f0dbde3f9da2e264b9d2dc16e4ce93cd53140387086  /tmp/attendance-v1-frozen.html" | sha256sum --check --strict

      - name: Verify historical Phase 3A external-module extraction
        shell: python
        run: |
          import re
          import subprocess

          pre3_sha = "88fffe819a4b287bd05c48c0933ebf14c7d913d2"
          phase3a_sha = "0526944153c4176d47ea1a2b0891e3ed56fe479c"
          for sha in (pre3_sha, phase3a_sha):
              subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], check=True)

          before = subprocess.check_output(["git", "show", f"{pre3_sha}:index.html"], text=True)
          matches = list(re.finditer(r'<script\s+type="module"[^>]*>\n(.*?)</script>', before, flags=re.S | re.I))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one pre-Phase-3 inline ES module, found {len(matches)}")

          match = matches[0]
          expected_module = match.group(1)
          phase3a_module = subprocess.check_output(["git", "show", f"{phase3a_sha}:assets/js/main.js"], text=True)
          if phase3a_module != expected_module:
              raise SystemExit("Historical Phase 3A main.js is not byte-for-byte equivalent to the pre-Phase-3 inline module")

          loader = '<script type="module" src="./assets/js/main.js"></script>'
          expected_html = before[:match.start()] + loader + before[match.end():]
          phase3a_html = subprocess.check_output(["git", "show", f"{phase3a_sha}:index.html"], text=True)
          if phase3a_html != expected_html:
              raise SystemExit("Historical Phase 3A index.html contains changes beyond the exact external-module extraction")

      - name: Verify historical Phase 3B1 Supabase client split
        shell: python
        run: |
          import subprocess

          phase3a_sha = "0526944153c4176d47ea1a2b0891e3ed56fe479c"
          phase3b1_sha = "ad2026b1056e311e41b50746601398938b73e16a"
          for sha in (phase3a_sha, phase3b1_sha):
              subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], check=True)

          before_main = subprocess.check_output(["git", "show", f"{phase3a_sha}:assets/js/main.js"], text=True)
          old_import = "import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/+esm';\n"
          new_import = "import { createAttendanceClient } from './supabase-client.js';\n"
          old_client = "const sb=createClient(\n  'https://rojetehazryfpcxlwtbi.supabase.co',\n  'sb_publishable_gc1-vVGBZOSgw32SCJumyw__vm0e3Jd',\n  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}\n);\n"
          new_client = "const sb=createAttendanceClient();\n"
          if before_main.count(old_import) != 1 or before_main.count(old_client) != 1:
              raise SystemExit("Historical Phase 3A source does not contain the expected unique Supabase client blocks")

          expected_main = before_main.replace(old_import, new_import, 1).replace(old_client, new_client, 1)
          phase3b1_main = subprocess.check_output(["git", "show", f"{phase3b1_sha}:assets/js/main.js"], text=True)
          if phase3b1_main != expected_main:
              raise SystemExit("Historical Phase 3B1 main.js is not the exact approved client extraction")

          expected_client = "\n".join([
              "import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/+esm';",
              "",
              "export function createAttendanceClient(){",
              "  return createClient(",
              "    'https://rojetehazryfpcxlwtbi.supabase.co',",
              "    'sb_publishable_gc1-vVGBZOSgw32SCJumyw__vm0e3Jd',",
              "    {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}",
              "  );",
              "}",
              ""
          ])
          phase3b1_client = subprocess.check_output(["git", "show", f"{phase3b1_sha}:assets/js/supabase-client.js"], text=True)
          if phase3b1_client != expected_client:
              raise SystemExit("Historical Phase 3B1 supabase-client.js is not the exact approved client factory")

          phase3a_html = subprocess.check_output(["git", "show", f"{phase3a_sha}:index.html"], text=True)
          phase3b1_html = subprocess.check_output(["git", "show", f"{phase3b1_sha}:index.html"], text=True)
          if phase3b1_html != phase3a_html:
              raise SystemExit("Historical Phase 3B1 changed index.html")

      - name: Verify exact Phase 3B2 shared-state split
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          phase3b1_sha = "ad2026b1056e311e41b50746601398938b73e16a"
          subprocess.run(["git", "cat-file", "-e", f"{phase3b1_sha}^{{commit}}"], check=True)
          before_main = subprocess.check_output(["git", "show", f"{phase3b1_sha}:assets/js/main.js"], text=True)

          client_import = "import { createAttendanceClient } from './supabase-client.js';\n"
          state_import = "import { state, requestSerial, beginRequest, isLatestRequest } from './app-state.js';\n"
          state_decl = "const state={bootstrap:null,teacherStatus:null,register:null,rows:[],loading:false,saving:false,currentClassId:null,currentDate:null,adminRoster:null,selectedAdminStudent:null,teacherRequests:[],teachers:[],monthlyStats:null,adminDashboard:null,reportOptions:null,periodReport:null};\n"
          serial_decl = "const requestSerial={register:0,monthlyStats:0,adminDashboard:0,reportOptions:0,periodReport:0};\n"
          helper_block = "function beginRequest(kind){requestSerial[kind]+=1;return requestSerial[kind];}\nfunction isLatestRequest(kind,serial){return requestSerial[kind]===serial;}\n"

          for label, text in [('client import', client_import), ('state declaration', state_decl), ('request serial declaration', serial_decl), ('request helper block', helper_block)]:
              if before_main.count(text) != 1:
                  raise SystemExit(f"Historical Phase 3B1 source does not contain exactly one {label}")

          expected_main = before_main.replace(client_import, client_import + state_import, 1)
          expected_main = expected_main.replace(state_decl, '', 1).replace(serial_decl, '', 1).replace(helper_block, '', 1)
          current_main = Path("assets/js/main.js").read_text(encoding="utf-8")
          if current_main != expected_main:
              raise SystemExit("assets/js/main.js contains changes beyond the exact Phase 3B2 state/request-serial extraction")

          expected_state = "\n".join([
              "export const state={bootstrap:null,teacherStatus:null,register:null,rows:[],loading:false,saving:false,currentClassId:null,currentDate:null,adminRoster:null,selectedAdminStudent:null,teacherRequests:[],teachers:[],monthlyStats:null,adminDashboard:null,reportOptions:null,periodReport:null};",
              "export const requestSerial={register:0,monthlyStats:0,adminDashboard:0,reportOptions:0,periodReport:0};",
              "",
              "export function beginRequest(kind){requestSerial[kind]+=1;return requestSerial[kind];}",
              "export function isLatestRequest(kind,serial){return requestSerial[kind]===serial;}",
              ""
          ])
          current_state = Path("assets/js/app-state.js").read_text(encoding="utf-8")
          if current_state != expected_state:
              raise SystemExit("assets/js/app-state.js is not the exact approved Phase 3B2 shared-state module")

          historical_client = subprocess.check_output(["git", "show", f"{phase3b1_sha}:assets/js/supabase-client.js"], text=True)
          current_client = Path("assets/js/supabase-client.js").read_text(encoding="utf-8")
          if current_client != historical_client:
              raise SystemExit("Phase 3B2 must not change supabase-client.js")

          historical_html = subprocess.check_output(["git", "show", f"{phase3b1_sha}:index.html"], text=True)
          current_html = Path("index.html").read_text(encoding="utf-8")
          if current_html != historical_html:
              raise SystemExit("Phase 3B2 must not change index.html")

      - name: Check current JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/main.js
          node --check assets/js/supabase-client.js
          node --check assets/js/app-state.js
