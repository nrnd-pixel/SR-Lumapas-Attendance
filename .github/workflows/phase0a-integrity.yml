name: Phase 0A Integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-baseline-and-current:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with frozen baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected current files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/js/main.js
          test -f netlify.toml
          test -f README.txt

      - name: Verify frozen Phase 0A index checksum
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e c578b4240a2bd9899db602fa818bda99bd6ff3cd^{commit}
          git show c578b4240a2bd9899db602fa818bda99bd6ff3cd:index.html > /tmp/attendance-v1-frozen.html
          echo "199d93f81c1cdb1742544f0dbde3f9da2e264b9d2dc16e4ce93cd53140387086  /tmp/attendance-v1-frozen.html" | sha256sum --check --strict

      - name: Verify Phase 3A external-module extraction equivalence
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          base_sha = "88fffe819a4b287bd05c48c0933ebf14c7d913d2"
          subprocess.run(["git", "cat-file", "-e", f"{base_sha}^{{commit}}"], check=True)
          before = subprocess.check_output(["git", "show", f"{base_sha}:index.html"], text=True)

          matches = list(re.finditer(r'<script\s+type="module"[^>]*>\n(.*?)</script>', before, flags=re.S | re.I))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one pre-Phase-3 inline ES module, found {len(matches)}")

          match = matches[0]
          expected_module = match.group(1)
          current_module = Path("assets/js/main.js").read_text(encoding="utf-8")
          if current_module != expected_module:
              raise SystemExit("assets/js/main.js is not byte-for-byte equivalent to the pre-Phase-3 inline module")

          loader = '<script type="module" src="./assets/js/main.js"></script>'
          expected_html = before[:match.start()] + loader + before[match.end():]
          current_html = Path("index.html").read_text(encoding="utf-8")
          if current_html != expected_html:
              raise SystemExit("index.html contains changes beyond the exact Phase 3A module extraction")

      - name: Check current JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/main.js
