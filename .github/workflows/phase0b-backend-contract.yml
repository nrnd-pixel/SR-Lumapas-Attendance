name: Phase 0B Backend Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Phase 0B source contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          v13_path = "supabase/migrations/20260917090547_attendance_v13_shared_reporting_model.sql"
          v14_path = "supabase/migrations/20260918094529_attendance_v14_register_write_boundary.sql"
          v15_path = "supabase/migrations/20260918144321_attendance_v15_student_movement_write_boundary.sql"
          v16_path = "supabase/migrations/20260919005727_attendance_v16_teacher_management_write_boundary.sql"
          v17_path = "supabase/migrations/20260919015041_attendance_v17_teacher_role_persistence.sql"
          v18_path = "supabase/migrations/20260919044948_attendance_v18_structural_write_boundary.sql"
          v19_path = "supabase/migrations/20260920060510_attendance_v19_fk_index_coverage.sql"
          v20_path = "supabase/migrations/20260920100523_attendance_v20_enrolment_lifecycle_contract.sql"
          phase5a_fixture_path = "supabase/fixtures/phase5a_security_fixture.sql"
          phase5a_security_path = "supabase/verify/attendance_security_access_contract.sql"
          phase5c_movement_path = "supabase/verify/attendance_student_movement_v15_contract.sql"
          phase5d_teacher_path = "supabase/verify/attendance_teacher_management_v16_contract.sql"
          phase5e_teacher_path = "supabase/verify/attendance_teacher_role_v17_contract.sql"
          phase5f1_structural_path = "supabase/verify/attendance_structural_write_v18_contract.sql"
          phase6a_fk_index_path = "supabase/verify/attendance_fk_index_v19_contract.sql"
          phase6b_lifecycle_path = "supabase/verify/attendance_enrolment_lifecycle_v20_contract.sql"
          required = [
              "supabase/README.md",
              "supabase/baseline/attendance_v1_schema.sql",
              "supabase/baseline/attendance_v1_reference_data.sql",
              "supabase/baseline/production_migration_history.md",
              v13_path,
              v14_path,
              v15_path,
              v16_path,
              v17_path,
              v18_path,
              v19_path,
              v20_path,
              "supabase/verify/attendance_contract.sql",
              "supabase/verify/attendance_reporting_population_fixtures.sql",
              "supabase/verify/attendance_reporting_v13_equivalence.sql",
          ]
          for path in [*required, phase5a_fixture_path, phase5a_security_path, phase5c_movement_path, phase5d_teacher_path, phase5e_teacher_path, phase5f1_structural_path, phase6a_fk_index_path, phase6b_lifecycle_path]:
              if not Path(path).is_file():
                  raise SystemExit(f"missing required file: {path}")

          schema = Path("supabase/baseline/attendance_v1_schema.sql").read_text()
          reference = Path("supabase/baseline/attendance_v1_reference_data.sql").read_text()
          history = Path("supabase/baseline/production_migration_history.md").read_text()
          contract = Path("supabase/verify/attendance_contract.sql").read_text()
          reporting_fixtures = Path("supabase/verify/attendance_reporting_population_fixtures.sql").read_text()
          reporting_v13 = Path(v13_path).read_text()
          register_v14 = Path(v14_path).read_text()
          movement_v15 = Path(v15_path).read_text()
          teacher_v16 = Path(v16_path).read_text()
          teacher_v17 = Path(v17_path).read_text()
          structural_v18 = Path(v18_path).read_text()
          fk_index_v19 = Path(v19_path).read_text()
          lifecycle_v20 = Path(v20_path).read_text()
          reporting_v13_equivalence = Path("supabase/verify/attendance_reporting_v13_equivalence.sql").read_text()
          phase5a_fixture = Path(phase5a_fixture_path).read_text()
          phase5a_security = Path(phase5a_security_path).read_text()
          phase5c_movement = Path(phase5c_movement_path).read_text()
          phase5d_teacher = Path(phase5d_teacher_path).read_text()
          phase5e_teacher = Path(phase5e_teacher_path).read_text()
          phase5f1_structural = Path(phase5f1_structural_path).read_text()
          phase6a_fk_index = Path(phase6a_fk_index_path).read_text()
          phase6b_lifecycle = Path(phase6b_lifecycle_path).read_text()
          combined = "\n".join(Path(p).read_text() for p in required)

          # Public-repository safety: concrete secrets/credentials/identity exports.
          forbidden_patterns = {
              "service-role secret": r"\bsb_secret_[A-Za-z0-9_-]+\b",
              "legacy JWT/service key": r"\beyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\b",
              "database URL": r"postgres(?:ql)?://",
              "private key": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
              "concrete email address": r"\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b",
              "UUID literal": r"\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b",
          }
          for label, pattern in forbidden_patterns.items():
              if re.search(pattern, combined, re.I):
                  raise SystemExit(f"forbidden {label} found in Phase 0B public source")

          # Phase 5A synthetic security files are deliberately excluded from the
          # generic UUID/email scan above because their all-zero test IDs and
          # example.invalid accounts are deterministic fixtures, not production data.
          phase5a_combined = phase5a_fixture + "\n" + phase5a_security + "\n" + phase5c_movement + "\n" + phase5d_teacher + "\n" + phase5e_teacher + "\n" + phase6b_lifecycle
          phase5a_forbidden = {
              "service-role secret": r"\bsb_secret_[A-Za-z0-9_-]+\b",
              "legacy JWT/service key": r"\beyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\b",
              "database URL": r"postgres(?:ql)?://",
              "private key": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
          }
          for label, pattern in phase5a_forbidden.items():
              if re.search(pattern, phase5a_combined, re.I):
                  raise SystemExit(f"forbidden {label} found in Phase 5A security source")
          phase5a_emails = re.findall(
              r"\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b",
              phase5a_combined,
              re.I,
          )
          if any(not email.lower().endswith("@example.invalid") for email in phase5a_emails):
              raise SystemExit("non-synthetic email address found in Phase 5A security source")
          if re.search(r"(?i)\bscience\.", phase5a_combined):
              raise SystemExit("Phase 5A Attendance security source must not touch Science objects")

          phase5a_fixture_markers = [
              "Phase 5A synthetic-only security/access fixture",
              "phase5a-teacher@example.invalid",
              "phase5a-outsider@example.invalid",
              "Synthetic Phase 5A write-boundary test day",
              "2026-04-01",
          ]
          for marker in phase5a_fixture_markers:
              if marker not in phase5a_fixture:
                  raise SystemExit(f"Phase 5A fixture marker missing: {marker}")

          phase5a_security_markers = [
              "public_rpc_security_mode_inventory",
              "unexpected_public_execute",
              "security_definer_search_path",
              "security_definer_authorization_marker",
              "authenticated_direct_write_surface",
              "private_audit_client_privilege",
              "internal_reporting_engine_execute",
              "Anonymous client: signup options succeeds",
              "Outsider unexpectedly authorized",
              "Direct authenticated daily_registers INSERT was not blocked",
              "Direct authenticated attendance_records DELETE was not blocked",
              "Outsider unexpectedly saved assigned-class register",
              "Complete-roster rejection was not preserved",
              "Non-school-day rejection was not preserved",
              "Controlled correction contract failed",
              "Correction audit contract failed",
              "Authenticated client unexpectedly read private audit history",
          ]
          for marker in phase5a_security_markers:
              if marker not in phase5a_security:
                  raise SystemExit(f"Phase 5A security verifier marker missing: {marker}")
          if phase5a_security.count("rollback;") < 6:
              raise SystemExit("Phase 5A role/write exercises must remain rollback-isolated")

          phase5c_markers = [
              "Phase 5C student-movement write-boundary verifier",
              "movement_rpc_contract",
              "movement_table_privilege",
              "Direct authenticated students INSERT was not blocked",
              "Assigned teacher unexpectedly used transfer-out",
              "Outsider unexpectedly used move-class",
              "Transfer-in movement history was not written",
              "Transfer-out changed saved attendance history",
              "Move Class changed old attendance history",
          ]
          for marker in phase5c_markers:
              if marker not in phase5c_movement:
                  raise SystemExit(f"Phase 5C movement verifier marker missing: {marker}")
          if phase5c_movement.count("rollback;") < 6:
              raise SystemExit("Phase 5C movement exercises must remain rollback-isolated")

          phase5d_markers = [
              "Phase 5D teacher-management write-boundary verifier",
              "teacher_management_table_privilege",
              "teacher_management_rpc_contract",
              "Direct authenticated teacher_school_memberships INSERT was not blocked",
              "Direct authenticated teacher_class_assignments DELETE was not blocked",
              "Non-admin unexpectedly reviewed a teacher request",
              "Generic teacher class-assignment contract changed",
              "request_approved audit contract changed",
              "access_disabled audit contract changed",
              "access_enabled audit contract changed",
              "Invoker bootstrap/read contract changed after grant revocation",
          ]
          for marker in phase5d_markers:
              if marker not in phase5d_teacher:
                  raise SystemExit(f"Phase 5D teacher-management verifier marker missing: {marker}")
          if phase5d_teacher.count("rollback;") < 3:
              raise SystemExit("Phase 5D teacher-management exercises must remain rollback-isolated")

          phase5e_markers = [
              "Phase 5E teacher-role persistence verifier",
              "teacher_assignment_role_constraint",
              "teacher_role_approval_rpc_contract",
              "teacher_role_table_privilege",
              "Class Teacher assignment role was not persisted",
              "Assistant Teacher assignment role was not persisted",
              "Class access changed for assignment role",
              "Teacher status role changed for",
              "Enable/disable changed authoritative assignment role",
          ]
          for marker in phase5e_markers:
              if marker not in phase5e_teacher:
                  raise SystemExit(f"Phase 5E teacher-role verifier marker missing: {marker}")
          if phase5e_teacher.count("rollback;") < 1:
              raise SystemExit("Phase 5E teacher-role exercises must remain rollback-isolated")

          # Exact structural inventory from the captured Phase 0B baseline snapshot.
          expected_tables = {
              "attendance.absence_reasons",
              "attendance.academic_years",
              "attendance.attendance_codes",
              "attendance.attendance_records",
              "attendance.calendar_dates",
              "attendance.classes",
              "attendance.daily_registers",
              "attendance.enrolments",
              "attendance.schools",
              "attendance.settings",
              "attendance.student_movements",
              "attendance.students",
              "attendance.teacher_class_assignments",
              "attendance.teacher_school_memberships",
              "attendance.teacher_signup_requests",
              "attendance.terms",
              "attendance_private.attendance_record_audit",
              "attendance_private.teacher_access_audit",
          }
          actual_tables = set(re.findall(
              r"(?im)^create table ((?:attendance|attendance_private)\.[a-z0-9_]+)\s*\(",
              schema
          ))
          if actual_tables != expected_tables:
              raise SystemExit(
                  "table inventory mismatch: "
                  f"missing={sorted(expected_tables-actual_tables)} "
                  f"extra={sorted(actual_tables-expected_tables)}"
              )
          exact_counts = {
              "constraints": (r"(?im)^alter table .* add constraint ", 94),
              "non-constraint indexes": (r"(?im)^create (?:unique )?index ", 30),
              "functions": (r"(?im)^create or replace function ", 25),
              "SECURITY DEFINER functions": (r"(?i)\bsecurity\s+definer\b", 15),
              "RLS policies": (r"(?im)^create policy ", 50),
              "triggers": (r"(?im)^create trigger ", 13),
          }
          for label, (pattern, expected_count) in exact_counts.items():
              actual_count = len(re.findall(pattern, schema))
              if actual_count != expected_count:
                  raise SystemExit(
                      f"{label} mismatch: expected={expected_count} actual={actual_count}"
                  )

          # Baseline snapshot public RPC inventory remains frozen; later repository
          # migrations are verified independently below.
          expected_rpcs = {
              "attendance_signup_options",
              "attendance_submit_teacher_request",
              "attendance_teacher_status",
              "attendance_bootstrap",
              "attendance_load_register",
              "attendance_save_register",
              "attendance_monthly_class_stats",
              "attendance_admin_school_dashboard",
              "attendance_class_report_options",
              "attendance_class_period_report",
              "attendance_admin_student_roster",
              "attendance_admin_teacher_requests",
              "attendance_admin_teachers",
              "attendance_admin_review_teacher_request",
              "attendance_admin_set_teacher_active",
              "attendance_admin_transfer_in",
              "attendance_admin_transfer_out",
              "attendance_admin_move_class",
          }
          actual_rpcs = set(re.findall(
              r"(?im)^create or replace function public\.(attendance_[a-z0-9_]+)\(",
              schema
          ))
          if actual_rpcs != expected_rpcs:
              raise SystemExit(
                  "public RPC mismatch: "
                  f"missing={sorted(expected_rpcs-actual_rpcs)} "
                  f"extra={sorted(actual_rpcs-expected_rpcs)}"
              )

          # Non-sensitive reference rows only.
          if reference.count("insert into attendance.attendance_codes") != 1:
              raise SystemExit("attendance code seed missing/duplicated")
          if reference.count("insert into attendance.absence_reasons") != 1:
              raise SystemExit("absence reason seed missing/duplicated")
          forbidden_inserts = [
              "attendance.students",
              "attendance.enrolments",
              "attendance.daily_registers",
              "attendance.attendance_records",
              "attendance.teacher_school_memberships",
              "attendance.teacher_class_assignments",
              "attendance.teacher_signup_requests",
              "attendance.student_movements",
          ]
          lowref = reference.lower()
          for table in forbidden_inserts:
              if f"insert into {table}" in lowref:
                  raise SystemExit(f"production-data insert forbidden: {table}")

          # Reporting and correction semantic source guards in the captured baseline.
          required_markers = [
              "Correction reason is required when changing a saved attendance register",
              "correction_count = correction_count + 1",
              "attendance.correction_reason",
              "register_exists",
              "possible_attendance",
          ]
          for marker in required_markers:
              if marker not in schema:
                  raise SystemExit(f"required semantic marker missing: {marker}")

          # Phase 4A reporting-population verifier contract. The file is read-only
          # and must preserve explicit Whole-Class vs Non-SEN semantics plus both
          # protected 3A headline fixture pairs.
          fixture_markers = [
              "whole_class",
              "non_sen",
              "include_in_class_stats",
              "425,398",
              "408,392",
              "1125,1051",
              "1080,1036",
              "0.9365::numeric",
              "0.9608::numeric",
              "0.9342::numeric",
              "0.9593::numeric",
          ]
          for marker in fixture_markers:
              if marker not in reporting_fixtures:
                  raise SystemExit(f"reporting population fixture marker missing: {marker}")
          if re.search(r"(?im)^\s*(insert|update|delete|truncate|alter|drop|create|grant|revoke)\b", reporting_fixtures):
              raise SystemExit("reporting population verifier must remain read-only")

          # Phase 4B1 migration: source-only reporting-function changes. It must not
          # mutate tables/data, touch Science, parse free-text reporting groups, or
          # overload the three existing Data API reporting function names.
          if re.search(r"(?im)^\s*(insert|update|delete|truncate|alter\s+table|drop\s+table)\b", reporting_v13):
              raise SystemExit("Phase 4B1 migration must not mutate Attendance table data/structure")
          if re.search(r"(?i)\bscience\.", reporting_v13):
              raise SystemExit("Phase 4B1 migration must not touch Science objects")
          if "reporting_group" in reporting_v13.lower():
              raise SystemExit("Phase 4B1 must use include_in_class_stats, not free-text reporting_group parsing")

          expected_v13_defs = {
              "attendance.reporting_class_period_facts": 1,
              "public.attendance_monthly_class_stats_v2": 1,
              "public.attendance_admin_school_dashboard_v2": 1,
              "public.attendance_class_period_report_v2": 1,
              "public.attendance_monthly_class_stats": 1,
              "public.attendance_admin_school_dashboard": 1,
              "public.attendance_class_period_report": 1,
          }
          for fn, expected_count in expected_v13_defs.items():
              actual_count = len(re.findall(
                  rf"(?im)^create or replace function\s+{re.escape(fn)}\s*\(",
                  reporting_v13
              ))
              if actual_count != expected_count:
                  raise SystemExit(
                      f"Phase 4B1 function definition mismatch for {fn}: "
                      f"expected={expected_count} actual={actual_count}"
                  )

          migration_markers = [
              "security invoker",
              "include_in_class_stats",
              "whole_class",
              "non_sen",
              "Reporting population must be whole_class or non_sen",
              "attendance.reporting_class_period_facts",
              "attendance_monthly_class_stats_v2",
              "attendance_admin_school_dashboard_v2",
              "attendance_class_period_report_v2",
              "revoke all on function attendance.reporting_class_period_facts(uuid,date,date,text)",
              "grant execute on function public.attendance_monthly_class_stats_v2(uuid,date,text)",
              "grant execute on function public.attendance_admin_school_dashboard_v2(uuid,date,text)",
              "grant execute on function public.attendance_class_period_report_v2(uuid,text,text,uuid,date)",
          ]
          low_v13 = reporting_v13.lower()
          for marker in migration_markers:
              if marker.lower() not in low_v13:
                  raise SystemExit(f"Phase 4B1 migration marker missing: {marker}")
          if reporting_v13.count("- 'population'") != 3:
              raise SystemExit("all three legacy reporting RPCs must remove the v2 population field")

          forbidden_overloads = [
              r"create or replace function\s+public\.attendance_monthly_class_stats\s*\(\s*p_class_id\s+uuid\s*,\s*p_month\s+date\s*,\s*p_population",
              r"create or replace function\s+public\.attendance_admin_school_dashboard\s*\(\s*p_school_id\s+uuid\s*,\s*p_month\s+date\s*,\s*p_population",
              r"create or replace function\s+public\.attendance_class_period_report\s*\([^)]*p_population",
          ]
          for pattern in forbidden_overloads:
              if re.search(pattern, reporting_v13, re.I | re.S):
                  raise SystemExit("Phase 4B1 must use uniquely named *_v2 RPCs, not Data API overloads")

          # Phase 5B migration: only execution mode + authenticated DML boundary.
          # It must not rewrite the RPC body, alter tables/RLS, touch Science, or mutate data.
          if re.search(r"(?i)\bscience\.", register_v14):
              raise SystemExit("Phase 5B migration must not touch Science objects")
          if re.search(r"(?im)^\s*(insert|update|delete|truncate|create|drop|alter\s+table|grant)\b", register_v14):
              raise SystemExit("Phase 5B migration contains an out-of-scope statement")
          normalized_v14 = " ".join(register_v14.lower().split())
          v14_markers = [
              "alter function public.attendance_save_register(uuid,date,jsonb,text) security definer",
              "revoke insert, update, delete on attendance.daily_registers, attendance.attendance_records from authenticated",
          ]
          for marker in v14_markers:
              if marker not in normalized_v14:
                  raise SystemExit(f"Phase 5B migration marker missing: {marker}")
          if register_v14.lower().count("alter function public.attendance_save_register") != 1:
              raise SystemExit("Phase 5B must alter attendance_save_register exactly once")
          if register_v14.lower().count("revoke insert, update, delete") != 1:
              raise SystemExit("Phase 5B must contain exactly one authenticated DML revoke")
          if "create or replace function" in register_v14.lower():
              raise SystemExit("Phase 5B must not rewrite attendance_save_register body")

          # Phase 5C migration: movement RPC privilege boundary only. Transfer In
          # keeps its body; Transfer Out/Move Class are rewritten only to establish
          # an explicit admin guard before privileged row access.
          if re.search(r"(?i)\bscience\.", movement_v15):
              raise SystemExit("Phase 5C migration must not touch Science objects")
          if re.search(r"(?im)^\s*(truncate|drop\s+table|alter\s+table|grant)\b", movement_v15):
              raise SystemExit("Phase 5C migration contains an out-of-scope structural/grant statement")
          normalized_v15 = " ".join(movement_v15.lower().split())
          v15_markers = [
              "alter function public.attendance_admin_transfer_in( uuid,uuid,text,text,text,date,text,boolean,text ) security definer",
              "create or replace function public.attendance_admin_transfer_out",
              "create or replace function public.attendance_admin_move_class",
              "security definer",
              "attendance.teacher_school_memberships",
              "attendance.is_school_admin",
              "revoke insert, update, delete on attendance.students, attendance.enrolments, attendance.student_movements from authenticated",
          ]
          for marker in v15_markers:
              if marker not in normalized_v15:
                  raise SystemExit(f"Phase 5C migration marker missing: {marker}")
          if movement_v15.lower().count("create or replace function public.attendance_admin_transfer_out") != 1:
              raise SystemExit("Phase 5C must rewrite transfer-out exactly once")
          if movement_v15.lower().count("create or replace function public.attendance_admin_move_class") != 1:
              raise SystemExit("Phase 5C must rewrite move-class exactly once")
          if movement_v15.lower().count("alter function public.attendance_admin_transfer_in") != 1:
              raise SystemExit("Phase 5C must alter transfer-in mode exactly once")

          # Phase 5D migration: authenticated teacher-management table DML revoke only.
          # Existing coordinated teacher-admin RPC bodies/modes must remain untouched.
          if re.search(r"(?i)\bscience\.", teacher_v16):
              raise SystemExit("Phase 5D migration must not touch Science objects")
          if re.search(r"(?im)^\s*(insert|update|delete|truncate|create|drop|alter|grant)\b", teacher_v16):
              raise SystemExit("Phase 5D migration contains an out-of-scope statement")
          normalized_v16 = " ".join(teacher_v16.lower().split())
          v16_marker = (
              "revoke insert, update, delete on attendance.teacher_school_memberships, "
              "attendance.teacher_class_assignments from authenticated"
          )
          if v16_marker not in normalized_v16:
              raise SystemExit("Phase 5D teacher-management DML revoke marker missing")
          if teacher_v16.lower().count("revoke insert, update, delete") != 1:
              raise SystemExit("Phase 5D must contain exactly one authenticated DML revoke")
          if re.search(r"(?im)^\s*(create\s+or\s+replace\s+function|alter\s+function)\b", teacher_v16):
              raise SystemExit("Phase 5D must not rewrite or alter teacher-management RPCs")

          # Phase 5E migration: persist the already-approved class assignment type
          # without changing school membership roles, access semantics, grants/RLS,
          # Science objects, or public RPC signatures.
          if re.search(r"(?i)\bscience\.", teacher_v17):
              raise SystemExit("Phase 5E migration must not touch Science objects")
          normalized_v17 = " ".join(teacher_v17.lower().split())
          v17_markers = [
              "alter table attendance.teacher_class_assignments drop constraint if exists teacher_class_assignments_role_check",
              "check (role in ('teacher','viewer','class_teacher','assistant_teacher'))",
              "create or replace function public.attendance_admin_review_teacher_request",
              "values(v_req.user_id,v_req.school_id,'teacher',true)",
              "values(v_req.user_id,v_target_class,v_assignment_type,true)",
              "set role=v_assignment_type, active=true, updated_at=now()",
              "having count(distinct approved_assignment_type)=1",
              "and a.role='teacher'",
          ]
          for marker in v17_markers:
              if marker not in normalized_v17:
                  raise SystemExit(f"Phase 5E migration marker missing: {marker}")
          if teacher_v17.lower().count("create or replace function public.attendance_admin_review_teacher_request") != 1:
              raise SystemExit("Phase 5E must rewrite teacher approval RPC exactly once")
          if re.search(r"(?im)^\s*(grant|revoke|drop\s+table|truncate)\b", teacher_v17):
